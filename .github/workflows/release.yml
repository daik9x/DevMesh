name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    name: Build ${{ matrix.platform }} runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            task: packageLinuxX64
          - platform: windows-x64
            os: windows-2022
            task: packageWindowsX64
          - platform: macos-x64
            os: macos-14
            task: packageMacosX64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build and package on Unix
        if: runner.os != 'Windows'
        run: ./gradlew ${{ matrix.task }}

      - name: Build and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat ${{ matrix.task }}

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            build/release/DevMesh-*-${{ matrix.platform }}.*
            build/release/SHA256SUMS-${{ matrix.platform }}.txt

  release:
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate aggregate checksums
        working-directory: release-assets
        run: sha256sum DevMesh-*.zip DevMesh-*.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ -f "${notes_file}" ]; then
              gh release edit "${GITHUB_REF_NAME}" --title "DevMesh ${GITHUB_REF_NAME}" --notes-file "${notes_file}"
            fi
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          elif [ -f "${notes_file}" ]; then
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "DevMesh ${GITHUB_REF_NAME}" --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "DevMesh ${GITHUB_REF_NAME}" --generate-notes
          fi
